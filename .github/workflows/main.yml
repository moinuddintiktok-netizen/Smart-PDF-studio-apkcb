name: Build Smart PDF Studio APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  build-android:
    name: Build Smart PDF Studio APK
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install Android build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            git \
            zip \
            unzip \
            openjdk-17-jdk \
            autoconf \
            automake \
            autopoint \
            libtool \
            pkg-config \
            zlib1g-dev \
            libncurses5-dev \
            libncursesw5-dev \
            libtinfo6 \
            cmake \
            libffi-dev \
            libssl-dev \
            gettext \
            build-essential

      - name: Install Buildozer
        run: |
          python -m pip install --upgrade pip setuptools wheel
          python -m pip install "cython==0.29.34"
          python -m pip install --upgrade buildozer

      - name: Verify project
        run: |
          buildozer --version
          python --version
          java -version
          test -f main.py
          test -f buildozer.spec

      - name: Clean previous build
        run: |
          rm -rf .buildozer
          rm -rf bin

      - name: Build Android APK
        env:
          BUILDOZER_WARN_ON_ROOT: "0"
        run: |
          buildozer -v android debug 2>&1 | tee build.log

      - name: Show APK
        if: success()
        run: |
          find bin -type f -name "*.apk" -print

      - name: Upload APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: SmartPDFStudio-Android-APK
          path: bin/*.apk
          if-no-files-found: error
          retention-days: 30

      - name: Upload build log if failed
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: SmartPDFStudio-build-log
          path: build.log
          if-no-files-found: ignore
          retention-days: 7
