name: Build Ultimate PDF Toolkit & PC Cleaner Suite

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Install Dependencies
      run: |
        python -m pip install --upgrade pip setuptools wheel
        pip install pypdf pdf2docx docx2pdf Pillow PyMuPDF pyinstaller

    - name: Build Executable with PyInstaller
      run: |
        python -m PyInstaller --noconsole --onefile ultimate_suite.py

    - name: Upload Compiled EXE Artifact
      uses: actions/upload-artifact@v4
      with:
        name: Ultimate-PDF-Toolkit-PC-Cleaner-Suite
        path: dist/ultimate_suite.exe
        
