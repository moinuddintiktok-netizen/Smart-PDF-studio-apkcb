name: Build Smart PDF Studio APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  build-android:
    name: Build Smart PDF Studio APK
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Setup Java 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"

      - name: Install Android build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            git \
            zip \
            unzip \
            autoconf \
            automake \
            autopoint \
            libtool \
            pkg-config \
            zlib1g-dev \
            libncurses5-dev \
            libncursesw5-dev \
            libtinfo6 \
            cmake \
            libffi-dev \
            libssl-dev \
            gettext \
            build-essential

      - name: Install Buildozer
        run: |
          python -m pip install --upgrade pip setuptools wheel
          python -m pip install "cython==0.29.34"
          python -m pip install --upgrade buildozer

      - name: Verify project files
        run: |
          set -e

          echo "Checking project files..."

          test -f main.py
          test -f buildozer.spec

          echo "Checking buildozer.spec..."

          grep -Eq '^[[:space:]]*title[[:space:]]*=' buildozer.spec
          grep -Eq '^[[:space:]]*package.name[[:space:]]*=' buildozer.spec
          grep -Eq '^[[:space:]]*package.domain[[:space:]]*=' buildozer.spec

          echo "Project verification successful."

          buildozer --version
          python --version
          java -version

      - name: Clean previous Buildozer output
        run: |
          rm -rf .buildozer
          rm -rf bin
          mkdir -p bin

      - name: Build Android APK
        id: build_apk
        continue-on-error: true
        env:
          BUILDOZER_WARN_ON_ROOT: "0"
        run: |
          set -o pipefail

          echo "=========================================="
          echo " BUILDING SMART PDF STUDIO APK"
          echo "=========================================="

          buildozer -v android debug 2>&1 | tee build.log

      - name: Show Buildozer output
        if: always()
        run: |
          echo "=========================================="
          echo " BIN DIRECTORY"
          echo "=========================================="

          if [ -d "bin" ]; then
            find bin -type f -print || true
          else
            echo "bin directory does not exist."
          fi

          echo ""
          echo "=========================================="
          echo " APK SEARCH"
          echo "=========================================="

          find . -type f -name "*.apk" -print || true

      - name: Find generated APK
        id: find_apk
        run: |
          set -e

          APK="$(find bin -type f -name '*.apk' -print -quit)"

          if [ -z "$APK" ]; then
            echo ""
            echo "=========================================="
            echo " ERROR: APK NOT FOUND"
            echo "=========================================="
            echo "Buildozer did not generate an APK."
            echo ""
            echo "Check the uploaded build.log artifact."
            exit 1
          fi

          echo ""
          echo "=========================================="
          echo " APK FOUND"
          echo "=========================================="
          echo "$APK"

          echo "apk_path=$APK" >> "$GITHUB_OUTPUT"

      - name: Upload APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: SmartPDFStudio-Android-APK
          path: ${{ steps.find_apk.outputs.apk_path }}
          if-no-files-found: error
          retention-days: 30

      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: SmartPDFStudio-build-log
          path: build.log
          if-no-files-found: ignore
          retention-days: 7

      - name: Final build status
        if: always()
        run: |
          echo "=========================================="
          echo " SMART PDF STUDIO BUILD FINISHED"
          echo "=========================================="

          if [ "${{ steps.build_apk.outcome }}" != "success" ]; then
            echo "Buildozer reported a build failure."
            exit 1
          fi

          if [ "${{ steps.find_apk.outcome }}" != "success" ]; then
            echo "APK was not found."
            exit 1
          fi

          echo "APK build completed successfully."
